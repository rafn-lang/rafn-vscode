name: Publish
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Publish to Marketplace
        run: npx @vscode/vsce@latest publish --oidc
